#
# [CAN USER CUNG CAP] User xac nhan 16/09/2026 cong bo duoc 4 muc duoi day
# nhung CHUA gui so. De trong = khong hien gi. KHONG dien so tam.
# Khi co so: bo `{}` va viet tung truong, moi truong la mot cau ngan:
#   dongBao      - quy cach dong bao (so kg moi bao)
#   donToiThieu  - don toi thieu (le / si)
#   khuVucGiao   - khu vuc co giao hang
#   phiGiao      - phi giao hang
