  - ngay: [Monday, Tuesday, Wednesday, Thursday, Friday]
    mo: "08:00"
    dong: "17:00"
  - ngay: [Saturday]
    mo: "08:00"
    dong: "12:00"

# URL nhung ban do Google cho TRU SO. Giai tu link chia se user gui:
#   https://maps.app.goo.gl/TWyPHdo9VH4RhAhA8
# Link do redirect ra chuoi truy van nay kem `ftid` - Feature ID, ma dinh danh
# dia diem noi bo cua Google. Co `ftid` thi Google khong phai doan dia chi nua:
# no ghim dung diem, kem O DIA CHI o goc.
#
# HAI CHI TIET PHAI GIU DUNG, do duoc chu khong doan:
#   1. "Tran Xuan Hoa" - dau HUYEN tren chu a, khong phai "Hòa" nhu dia chi
#      phap dinh cua cong ty. Google luu ten duong theo chinh ta nay.
#   2. Dang NGAN "An Dong, Ho Chi Minh", khong co "Phuong"/"Quan 5".
# Da thu bon dang truy van theo dia chi phap dinh va CA BON deu truot: mot cai
# ra Phan Dang Luu (Phu Nhuan), mot cai ra Cao Thang (Quan 3), mot cai ra vung
# trong, va khong cai nao co ghim.
#
# Dia chi HIEN TREN TRANG van la dia chi phap dinh trong `diaDiem`; chuoi duoi
# day chi de Google tim dung diem.
# banDoNhung: DA BO. URL cu ghim toa nha Thong Tan Xa Quan 5 - do la van
# phong CONG TY ME, khong con la tru so cua Dinh Thep Sai Gon.
#
# Da do 06/09/2026: dia chi tru so moi (KDC Him Lam, Quan 7) GHIM DUNG
# bang truy van thuong `?q=<dia chi>` - chup lai thay cham do dat tai
# "Khu dan cu Him Lam Tan Hung". Khac voi dia chi Quan 5 truoc day, cai do
# thu bon dang truy van deu ghim sai quan.
#
# [CAN USER CUNG CAP] Link chia se Maps cua tru so Quan 7 (Maps -> Chia se
# -> copy link). Truy van thuong chi ra CHAM DO; muon co them O DIA CHI o
# goc ban do thi phai co `ftid` trong link, ma `ftid` chi lay duoc tu link
# chia se chu khong tu sinh duoc.
# banDoNhung: ""https://maps.google.com/maps?q=7%20Tr%E1%BA%A7n%20Xu%C3%A2n%20Ho%C3%A0,%20An%20%C4%90%C3%B4ng,%20H%E1%BB%93%20Ch%C3%AD%20Minh&ftid=0x31752efa2a21a447:0x3af959ff358ec0cd&z=17&output=embed""
# Email CHINH lay theo brochure - do la dia chi in tren giay khach dang cam.
# Email cua cong ty me xuong lam email phu.
