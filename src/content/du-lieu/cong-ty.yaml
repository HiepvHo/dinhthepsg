# lap Dinh Thep Sai Gon de tap trung vao dinh. Truoc do chinh cong ty me ban dinh.
#
# Nguon NAP: BROCHURE GIAY dang phat cho khach (anh user gui 06/09/2026).
# Brochure la thu khach cam trong tay - NAP tren web phai khop voi no, khong
# phai nguoc lai.
